<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.min.js"></script>
<style>
html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="video" playsinline webkit-playsinline autoplay></video>
<script>
const REFERER = 'https://shifshqip.com/k1/playlist/shifshqip.m3u';

function notify(method, arg) {
  if (window.AndroidBridge && typeof window.AndroidBridge[method] === 'function') {
    window.AndroidBridge[method](arg || '');
  }
}

function destroyPlayer() {
  if (window._shakaPlayer) {
    try { window._shakaPlayer.destroy(); } catch (e) {}
    window._shakaPlayer = null;
  }
  const video = document.getElementById('video');
  if (video) {
    video.removeAttribute('src');
    video.load();
  }
}

async function play(url) {
  destroyPlayer();
  const video = document.getElementById('video');
  if (!window.shaka || !shaka.Player || !shaka.Player.isBrowserSupported()) {
    notify('onError', 'unsupported');
    return;
  }
  shaka.polyfill.installAll();
  const player = new shaka.Player(video);
  window._shakaPlayer = player;
  player.configure({
    streaming: {
      lowLatencyMode: false,
      bufferingGoal: 45,
      rebufferingGoal: 4,
      bufferBehind: 90,
      stallEnabled: true,
      stallThreshold: 10,
      retryParameters: { maxAttempts: 3, baseDelay: 1000, backoffFactor: 2, fuzzFactor: 0.5 }
    },
    manifest: {
      retryParameters: { maxAttempts: 3, baseDelay: 1000, backoffFactor: 2, fuzzFactor: 0.5 }
    }
  });
  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Referer'] = REFERER;
  });
  player.addEventListener('error', () => notify('onError', 'shaka'));
  try {
    await player.load(url);
    await video.play();
    notify('onPlaying');
  } catch (e) {
    notify('onError', 'load');
  }
}

function pausePlayback() {
  const video = document.getElementById('video');
  if (video) video.pause();
}

function resumePlayback() {
  const video = document.getElementById('video');
  if (video) video.play().catch(() => {});
}
</script>
</body>
</html>
