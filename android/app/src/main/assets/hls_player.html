<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
    </style>
</head>
<body>
<video id="player" controls playsinline autoplay></video>
<script>
    const video = document.getElementById('player');
    let hls = null;
    let currentUrl = '';

    function destroyPlayer() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
    }

    function startStream(url) {
        if (!url) {
            return;
        }
        currentUrl = url;
        destroyPlayer();
        if (window.Hls && Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 90,
                maxBufferLength: 60,
                maxMaxBufferLength: 120,
                manifestLoadingTimeOut: 30000,
                manifestLoadingMaxRetry: 8,
                levelLoadingTimeOut: 30000,
                fragLoadingTimeOut: 60000,
                fragLoadingMaxRetry: 8
            });
            hls.attachMedia(video);
            hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                hls.loadSource(url);
            });
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (!data || !data.fatal) {
                    return;
                }
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    if (window.AndroidBridge && AndroidBridge.onNetworkError) {
                        AndroidBridge.onNetworkError();
                    } else {
                        hls.startLoad();
                    }
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else {
                    if (window.AndroidBridge && AndroidBridge.onFatalError) {
                        AndroidBridge.onFatalError();
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    window.updateStream = function (url) {
        if (!url || url === currentUrl) {
            return;
        }
        startStream(url);
    };

    startStream('__STREAM_URL__');
</script>
</body>
</html>
