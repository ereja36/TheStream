// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'com.android.library' version '8.13.1' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
}

subprojects {
    configurations.configureEach {
        exclude group: 'androidx.datastore', module: 'datastore'
        exclude group: 'androidx.datastore', module: 'datastore-android'
        exclude group: 'androidx.datastore', module: 'datastore-core'
        exclude group: 'androidx.datastore', module: 'datastore-core-android'
        exclude group: 'androidx.datastore', module: 'datastore-core-okio'
        exclude group: 'androidx.datastore', module: 'datastore-core-okio-jvm'
        exclude group: 'androidx.datastore', module: 'datastore-preferences'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-android'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-core'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-core-android'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-proto'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-external-protobuf'
        exclude group: 'com.google.firebase', module: 'firebase-sessions'
        exclude group: 'com.google.firebase', module: 'firebase-datastore'
    }
}
