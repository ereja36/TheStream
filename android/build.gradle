// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'com.android.library' version '8.13.1' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.datastore:datastore:1.1.1'
            force 'androidx.datastore:datastore-android:1.1.1'
            force 'androidx.datastore:datastore-core:1.1.1'
            force 'androidx.datastore:datastore-core-android:1.1.1'
            force 'androidx.datastore:datastore-core-okio:1.1.1'
            force 'androidx.datastore:datastore-core-okio-jvm:1.1.1'
            force 'androidx.datastore:datastore-preferences:1.1.1'
            force 'androidx.datastore:datastore-preferences-android:1.1.1'
            force 'androidx.datastore:datastore-preferences-core:1.1.1'
            force 'androidx.datastore:datastore-preferences-core-android:1.1.1'
            force 'androidx.datastore:datastore-preferences-proto:1.1.1'
            force 'androidx.datastore:datastore-preferences-external-protobuf:1.1.1'
        }
    }
}