name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'admin_panel/**'
      - 'android/**'
      - 'database/migrations/**'
      - 'deploy/**'
      - '.github/workflows/deploy-vps.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          SHIF_KEYSTORE_PASSWORD: ${{ secrets.SHIF_KEYSTORE_PASSWORD }}
          SHIF_KEY_PASSWORD: ${{ secrets.SHIF_KEY_PASSWORD }}
        run: |
          if [ -n "$SERVER_KEY" ] && [ -n "$REST_API_KEY" ]; then
            sed -i "s|SERVER_KEY = \"XXXXX\"|SERVER_KEY = \"$SERVER_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
            sed -i "s|REST_API_KEY = \"XXXXX\"|REST_API_KEY = \"$REST_API_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing VPS_SSH_PRIVATE_KEY or SSH_PRIVATE_KEY secret"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          HOST="${VPS_HOST:-57.128.254.213}"
          USER="${VPS_USER:-root}"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "VPS_HOST=$HOST" >> $GITHUB_ENV
          echo "VPS_USER=$USER" >> $GITHUB_ENV

      - name: Deploy panel/API/APK
        env:
          DB_PASS: ${{ secrets.VPS_DB_PASSWORD }}
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
        run: |
          chmod +x deploy/deploy-vps.sh
          VPS_HOST="${VPS_HOST}" VPS_USER="${VPS_USER}" DB_PASS="${DB_PASS}" REST_API_KEY="${REST_API_KEY}" \
            ./deploy/deploy-vps.sh

      - name: Verify live API
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
        run: |
          curl -fsSI "https://api.shifshqip.com/api/api.php?get_playlist_guard&api_key=${REST_API_KEY}&_=$(date +%s)" | rg -i 'cache-control|content-type' || true
          curl -fsS "https://api.shifshqip.com/api/api.php?get_playlist_guard&api_key=${REST_API_KEY}&_=$(date +%s)" | python3 - <<'PY'
import json,sys
data=json.load(sys.stdin)
assert data.get('status')=='ok', data
rules=data.get('rules') or []
if rules:
    ua=rules[0].get('user_agent')
    assert isinstance(ua, str), f'user_agent must be string, got {type(ua)}'
print('ok', 'rules=', len(rules), 'updated_at=', data.get('updated_at',''))
PY
