name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject API keys
        working-directory: android
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
        run: |
          if [ -n "$SERVER_KEY" ] && [ -n "$REST_API_KEY" ]; then
            sed -i "s|SERVER_KEY = \"XXXXX\"|SERVER_KEY = \"$SERVER_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
            sed -i "s|REST_API_KEY = \"XXXXX\"|REST_API_KEY = \"$REST_API_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        working-directory: android
        env:
          SHIF_KEYSTORE_PASSWORD: ${{ secrets.SHIF_KEYSTORE_PASSWORD }}
          SHIF_KEY_PASSWORD: ${{ secrets.SHIF_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon
          chmod +x package-release-apk.sh
          ./package-release-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shif-shqip-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
