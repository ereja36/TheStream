name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject API keys
        working-directory: android
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
        run: |
          if [ -n "$SERVER_KEY" ] && [ -n "$REST_API_KEY" ]; then
            sed -i "s|SERVER_KEY = \"XXXXX\"|SERVER_KEY = \"$SERVER_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
            sed -i "s|REST_API_KEY = \"XXXXX\"|REST_API_KEY = \"$REST_API_KEY\"|" app/src/main/java/com/shif/shqip/android/Config.java
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shif-shqip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
