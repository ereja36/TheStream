server {
    listen 80;
    listen [::]:80;
    server_name playlist.shifshqip.com;

    location /.well-known/acme-challenge/ {
        root /var/www/shifshqip-playlist;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playlist.shifshqip.com;

    ssl_certificate /etc/letsencrypt/live/playlist.shifshqip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playlist.shifshqip.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/shifshqip-playlist;
    index index.php;

    access_log /var/log/nginx/playlist.shifshqip.access.log;
    error_log /var/log/nginx/playlist.shifshqip.error.log;

    client_max_body_size 16m;

    if ($host != "playlist.shifshqip.com") {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
