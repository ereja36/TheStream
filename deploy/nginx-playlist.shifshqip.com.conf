server {
    listen 80;
    listen [::]:80;
    server_name playlist.shifshqip.com;

    root /var/www/shifshqip-playlist;
    index index.php;

    access_log /var/log/nginx/playlist.shifshqip.access.log;
    error_log /var/log/nginx/playlist.shifshqip.error.log;

    client_max_body_size 16m;

    location /.well-known/acme-challenge/ {
        root /var/www/shifshqip-playlist;
        allow all;
    }

    location / {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/shifshqip-playlist/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name playlist.shifshqip.com;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    access_log /var/log/nginx/playlist.shifshqip.access.log;
    error_log /var/log/nginx/playlist.shifshqip.error.log;

    client_max_body_size 16m;

    location / {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/shifshqip-playlist/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
