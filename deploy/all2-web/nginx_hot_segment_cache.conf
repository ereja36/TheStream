proxy_cache_path /var/cache/nginx/iptv levels=1:2 keys_zone=iptv_hot:128m max_size=4g inactive=30s use_temp_path=off;

upstream iptv_node {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

map $request_method $iptv_method_cacheable {
    default 0;
    GET 1;
    HEAD 1;
}

map $request_uri $iptv_path_cacheable {
    default 0;
    ~^/k1/proxy/seg 1;
}

map "$iptv_method_cacheable$iptv_path_cacheable" $iptv_skip_cache {
    default 1;
    "11" 0;
}

server {
    listen 80;
    server_name edge.example.com;

    location /k1/proxy/seg {
        proxy_pass http://iptv_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 256k;

        proxy_cache iptv_hot;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 206 8s;
        proxy_cache_lock on;
        proxy_cache_lock_age 10s;
        proxy_cache_lock_timeout 12s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Nginx-Hot-Cache $upstream_cache_status always;

        proxy_no_cache $iptv_skip_cache;
        proxy_cache_bypass $iptv_skip_cache;
    }

    location / {
        proxy_pass http://iptv_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
