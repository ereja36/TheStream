# Blloko APK direkt me IP — skedarët janë jashtë web root publik
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    root /var/www/html;
    index index.html;

    # Mos lejo shkarkim APK me IP direkt
    location ~* \.apk$ {
        return 403;
    }

    location = /shif-shqip-debug.apk {
        return 403;
    }

    location = /shif-shqip-release.apk {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
