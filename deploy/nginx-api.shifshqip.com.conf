server {
    listen 80;
    listen [::]:80;
    server_name api.shifshqip.com;

    root /var/www/shifshqip-api/the_stream;
    index index.php index.html index.htm;

    access_log /var/log/nginx/api.shifshqip.access.log;
    error_log /var/log/nginx/api.shifshqip.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/shifshqip-api/the_stream;
        allow all;
    }

    location = /shif-shqip.apk {
        alias /var/www/html/shif-shqip-debug.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shif-shqip.apk"';
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
